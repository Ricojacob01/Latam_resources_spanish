# =============================================================================
# Databricks Asset Bundle — Job del pipeline MLOps (CP/MLOps)
# =============================================================================
# El mismo Job que armas en la Jobs UI (módulo 07), como CÓDIGO para CI/CD.
#
#   cd CP/MLOps/bundle
#   databricks bundle validate
#   databricks bundle deploy -t dev
#   databricks bundle run mlops_churn_pipeline -t dev
#
# Las tareas referencian los notebooks de ../pipeline/. El grafo:
#   feature -> train -> validate -> { deploy_serving , batch_scoring }
# =============================================================================
bundle:
  name: cp_mlops_churn

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://fevm-ardemo-classic-dnubtw.cloud.databricks.com

resources:
  jobs:
    mlops_churn_pipeline:
      name: cp_mlops_churn_${workspace.current_user.short_name}
      job_clusters:
        - job_cluster_key: ml_cluster
          new_cluster:
            spark_version: 15.4.x-cpu-ml-scala2.12   # ML Runtime
            node_type_id: i3.xlarge
            num_workers: 1
      tasks:
        - task_key: feature_engineering
          job_cluster_key: ml_cluster
          notebook_task:
            notebook_path: ../pipeline/01_feature_engineering
        - task_key: train_and_register
          job_cluster_key: ml_cluster
          depends_on: [{ task_key: feature_engineering }]
          notebook_task:
            notebook_path: ../pipeline/02_train_and_register
        - task_key: validate_and_promote
          job_cluster_key: ml_cluster
          depends_on: [{ task_key: train_and_register }]
          notebook_task:
            notebook_path: ../pipeline/03_validate_and_promote
          max_retries: 1
        - task_key: deploy_serving
          job_cluster_key: ml_cluster
          depends_on: [{ task_key: validate_and_promote }]
          notebook_task:
            notebook_path: ../pipeline/04_deploy_serving
        - task_key: batch_scoring
          job_cluster_key: ml_cluster
          depends_on: [{ task_key: validate_and_promote }]
          notebook_task:
            notebook_path: ../pipeline/05_batch_scoring
      schedule:
        quartz_cron_expression: "0 0 6 ? * MON"   # lunes 6am
        timezone_id: America/Bogota
        pause_status: PAUSED                        # pausado para el lab
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
      queue:
        enabled: true
