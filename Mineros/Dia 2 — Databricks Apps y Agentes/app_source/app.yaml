command: ["streamlit", "run", "app.py"]

env:
  # ── Edita estos valores para tu entorno ──────────────────────────────
  - name: CATALOG
    value: "academia"                       # catálogo compartido
  - name: SCHEMA
    value: "TU_APELLIDO"                     # tu esquema del Día 1 (p. ej. john_doe)
  - name: SQL_HTTP_PATH
    value: "/sql/1.0/warehouses/XXXXXXXXXXXX"  # HTTP Path de tu SQL Warehouse
  - name: GENIE_SPACE_ID
    value: "PON_AQUI_TU_GENIE_SPACE_ID"     # ID del espacio Genie (Día 1, Lección 6)
